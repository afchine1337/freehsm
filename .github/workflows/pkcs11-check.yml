# ===========================================================================
# pkcs11-check.yml --- External behavioral harness run (#125).
#
# Runs Denis Mingulov's pkcs11-check (>100k vendor-neutral behavioral
# checks) against the digest-signed libfreehsm.so and uploads the
# JSON report + log as artifacts.
#
# NON-GATING by design : per pkcs11-check's own guidance, large
# xfail/fail counts are normal findings (PKCS#11 cannot express many
# capability constraints), so the job fails only if the harness itself
# fails to run or produce a report. Baseline regression comparison
# (pkcs11-check compare-results) is tracked as follow-up work.
# ===========================================================================
name: pkcs11-check

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'kat/**'
      - 'Makefile'
      - 'scripts/run_pkcs11_check.sh'
      - '.github/workflows/pkcs11-check.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'   # weekly, Monday 04:17 UTC

permissions:
  contents: read

jobs:
  pkcs11-check:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/freehsm-c-build:debian13-openssl-3.5
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Build + sign module
        run: |
          make clean
          # Built at the default FHSM_MAX_OBJECTS. The -DFHSM_MAX_OBJECTS=4096
          # override that used to be here dated from when the default was 64
          # and the harness's object churn filled the store, cascading
          # CKR_DEVICE_MEMORY across unrelated tests (FINDINGS I1 / F5). Both
          # reasons are gone: session objects are destroyed on C_CloseSession
          # since #125 -- the deeper fix the old comment asked for -- and the
          # default is now 1024. Runs at the default show no cascade.
          #
          # It also has to go: since #127 the mlock'd arena must hold a full
          # token of sensitive values, and 4096 of them would demand a 32 MiB
          # locked arena, more than the usual RLIMIT_MEMLOCK allows.
          make
          make integrity
          test -f libfreehsm.so

      - name: Install harness (opensc + pkcs11-check)
        run: |
          apt-get update -qq
          apt-get install -y -qq opensc python3-pip python3-venv
          python3 -m venv /opt/p11check
          # Pinned. Unpinned, this installed whatever PyPI had latest, so a
          # harness release could change the reported counts on a tree nobody
          # had touched -- and did: v0.1.9 closed three failures that v0.1.8
          # reported, with the module unchanged (docs/PKCS11_CHECK_FINDINGS.md,
          # 2026-09-03). A comparison whose reference version drifts on its own
          # cannot attribute a change to anything.
          /opt/p11check/bin/pip install --quiet 'pkcs11-check==0.1.9'
          ln -sf /opt/p11check/bin/pkcs11-check /usr/local/bin/pkcs11-check
          pkcs11-check version

      # FHSM_ALLOW_UNSIGNED keeps this job measuring what it has always
      # measured. The module is signed above and stays signed; this only tells
      # run_pkcs11_check.sh to take the unsigned path -- integrity check
      # skipped, FIPS provider not loaded, EVP fetches on the default provider.
      #
      # It became necessary on 2026-09-03. Until then the script forced
      # OPENSSL_CONF=/dev/null unconditionally, which silently prevented the
      # provider from ever loading; fixing that would have flipped this job to
      # the FIPS provider without renaming anything, and the counts recorded in
      # docs/PKCS11_CHECK_FINDINGS.md would have stopped describing what runs
      # here. A reference that changes meaning while keeping its name is the
      # defect this project spent two days removing elsewhere.
      #
      # Running the harness against the signed module with the provider loaded
      # is worth doing -- roughly 1700 tests where run_fips_tests.sh has 37 --
      # but as its own deliberate job with its own baseline, not as a silent
      # change of subject in this one.
      #
      # pipefail: without it `cmd | tee` reports tee's status, so a harness that
      # aborts (FATAL: C_InitToken failed, exit 2) would leave this step green.
      # Findings here are not a gate; a harness that never ran is not a finding.
      - name: Run pkcs11-check (default provider, integrity check bypassed)
        env:
          FHSM_ALLOW_UNSIGNED: '1'
        run: |
          set -o pipefail
          bash scripts/run_pkcs11_check.sh ./libfreehsm.so ./reports/pkcs11-check \
            2>&1 | tee harness.log

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## pkcs11-check run"
            echo '```'
            grep -A 20 "== Summary ==" harness.log | head -25 || true
            echo '```'
            echo "_Findings are evidence to investigate, not a verdict (see pkcs11-check docs/interpreting-results.md)._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pkcs11-check-report
          path: |
            reports/pkcs11-check/
            harness.log
          retention-days: 30
